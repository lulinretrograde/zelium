<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Zelium</title>
    <link rel="stylesheet" href="palette/palette.css" />
    <style>
      /* Transparent: the page shows through around the panel. No color-scheme
         on the root, or Chromium paints an opaque canvas behind the frame. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="palette/fuzzy.js"></script>
    <script src="palette/parse.js"></script>
    <script src="palette/icons.js"></script>
    <script src="palette/commands.js"></script>
    <script src="palette/settings.js"></script>
    <script src="palette/learn.js"></script>
    <script src="palette/palette.js"></script>
    <script src="frame.js"></script>
  </body>
</html>
